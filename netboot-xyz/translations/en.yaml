configuration:
  path:
    name: "Image Path"
    description: "Directory where images are stored."
  path_config:
    name: "Configuration Path"
    description: "Directory for configuration files."
  dhcp_range:
    name: "DHCP Range"
    description: "DHCP range for the PXE server."
  log_level:
    name: "Log Level"
    description: "Controls the verbosity of the app logs."
  menu_version:
    name: "Menu Version"
    description: "Version of the netboot.xyz menus to use (e.g. latest or a specific tag)."
  tftp_server_ip:
    name: "TFTP Server IP"
    description: "IP address of this Home Assistant host as seen by PXE clients. Set it when your DHCP server does not send next-server (option 66), otherwise clients look for TFTP on the router. Leave empty for upstream behaviour."
