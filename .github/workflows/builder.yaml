name: Builder

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    name: Discover add-ons
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build the add-on / architecture matrix
        id: discover
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import json
          import os

          import yaml

          # Only 64-bit builds exist: the add-on base images stopped publishing
          # armv7, armhf and i386 after 18.2.1.
          RUNNERS = {"amd64": "ubuntu-24.04", "aarch64": "ubuntu-24.04-arm"}
          PLATFORMS = {"amd64": "linux/amd64", "aarch64": "linux/arm64"}

          entries = []
          for path in sorted(glob.glob("*/config.yaml")):
              addon = os.path.dirname(path)
              with open(path, encoding="utf-8") as handle:
                  config = yaml.safe_load(handle)

              image = config.get("image")
              if not image:
                  continue

              with open(f"{addon}/build.yaml", encoding="utf-8") as handle:
                  build = yaml.safe_load(handle)

              for arch in config.get("arch", []):
                  if arch not in RUNNERS:
                      print(
                          f"::warning::{addon} declares {arch}, which can no "
                          "longer be built; skipping",
                      )
                      continue
                  entries.append(
                      {
                          "addon": addon,
                          "arch": arch,
                          "os": RUNNERS[arch],
                          "platform": PLATFORMS[arch],
                          "image": image.replace("{arch}", arch),
                          "build_from": build["build_from"][arch],
                          "name": config["name"],
                          "description": config["description"],
                          "version": str(config["version"]),
                      },
                  )

          print(f"matrix={json.dumps({'include': entries})}")
          PY

  build:
    needs: discover
    if: fromJson(needs.discover.outputs.matrix).include[0] != null
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.addon }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ matrix.image }}:${{ matrix.version }}
            ${{ matrix.image }}:latest
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_DESCRIPTION=${{ matrix.description }}
            BUILD_NAME=${{ matrix.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ matrix.version }}
