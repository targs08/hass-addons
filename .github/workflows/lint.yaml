name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    name: Discover add-ons
    outputs:
      addons: ${{ steps.discover.outputs.addons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: List add-on directories
        id: discover
        run: |
          addons=$(for f in */config.yaml; do dirname "$f"; done | jq -R . | jq -cs .)
          echo "addons=${addons}" >> "$GITHUB_OUTPUT"

  lint:
    needs: discover
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.addon }}
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"

  shellcheck:
    runs-on: ubuntu-latest
    name: Shellcheck
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          # Unmodified upstream code in the netboot-xyz fork. Fixing its
          # warnings here would only widen the diff against upstream.
          ignore_paths: netboot-xyz/root/etc/services.d/webapp
        env:
          SHELLCHECK_OPTS: -s bash -e SC1091
